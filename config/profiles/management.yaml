  руководство и работники компании без технической подготовки, ежемесячная сводка:
  последствия для бизнеса и людей простым языком, без технических деталей
format: brief
days: 30
max_items: 15
interests: >
  Громкие кибератаки и утечки данных в России и мире, крупные финансовые и имиджевые потери компаний,
  нарушение работы критической инфраструктуры, энергетики и промышленности, законы и требования регуляторов,
  угрозы для массовых сервисов, которыми пользуются сотрудники и руководители, заметные и необычные события ИБ.
stack: [Госуслуги, Telegram, WhatsApp, MAX, банковские приложения, Android, iPhone]
include_keywords: [утечка, ущерб, штраф, КИИ, энергетика, промышленность, мошенник, фишинг, закон]
